  - {group: Wiring, item: "CAT5e 3 m (encoder / sensor I2C)", qty: 1, eur: 2.0, mass_g: 60}
  - {group: Wiring, item: "Connectors: screw terminals, ferrules, JST-XH kit", qty: 1, eur: 4.0, mass_g: 30}
  - {group: Wiring, item: "Fuse holder 5 A + 48 V DC switch", qty: 1, eur: 2.0, mass_g: 40}
budget_note: "SARCTrac Mk5 (SARCNET) builds the mast platform and boom socket from galvanised angle brackets. This variant is NOT the default: it is not covered by calc/lsr2_sizing.py (no demonstrated clamp friction or boom bending path), galvanised steel next to the aluminium and stainless parts invites galvanic corrosion on the coast, and the steel is heavier than the 7 EUR / 9 EUR cast parts it replaces. Prices VERIFY."
budget:
  - {item: "Galvanised angle bracket 50x50x5, 100 mm (mast platform, replaces mast_clamp)", qty: 4, eur: 1.5, replaces: "mast_clamp (cast, 7 EUR): friction hold of the gearbox standstill torque not shown; use Tef-Gel/isolating washers against aluminium"}
  - {item: "Galvanised angle bracket 50x50x5, 100 mm + 2 U-bolts (boom socket, replaces boom_socket)", qty: 4, eur: 1.5, replaces: "boom_socket (cast, 9 EUR): does not give the Ø30 keyed hub, so the EL shaft would need a flange: fails the bending path of the one-sided boom"}
  - {item: "Galvanised M8 hardware set (U-bolts, nuts, washers)", qty: 1, eur: 4.0, replaces: "A4 M8 hardware: rusts within a season at the coast; mixed metals need Tef-Gel"}
