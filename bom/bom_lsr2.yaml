  - {group: Hardware, item: "EL bearing circlips: 2x DIN 471 Ø30 + 2x DIN 472 Ø62", qty: 1, eur: 1.2, mass_g: 6}
  - {group: Hardware, item: "DIN 705 Ø14 flanged set collar + M6 screw (AZ shaft top)", qty: 1, eur: 2.5, mass_g: 25, alt: "cheaper than a turned disc (~5 EUR with machining)"}
  - {group: Fasteners, item: "A4 M6x20 socket screw (body to mast bracket, gearbox flanges, yoke arms, lid)", qty: 30, eur: 0.15, mass_g: 12, alt: "8.8 zinc-flake screws; use Tef-Gel either way"}
  - {group: Fasteners, item: "A4 M6x25 socket screw (AZ gearbox to the shelf)", qty: 4, eur: 0.18, mass_g: 14}
  - {group: Fasteners, ref: clamp_bolts, item: "A4 M6x30 screw (boom clamps and saddle plate)", qty: 8, eur: 0.2, mass_g: 17}
