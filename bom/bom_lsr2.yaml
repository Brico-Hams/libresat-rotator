  - {group: Hardware, item: "M8 U-bolts for the mast (A4-80 or 8.8)", qty: 2, eur: 2.5, mass_g: 90, alt: "8.8 zinc-flake instead of A4-80"}
  - {group: Hardware, item: "V-ring seals (AZ + EL) + Ø6 cross pin", qty: 1, eur: 3.0, mass_g: 15}
