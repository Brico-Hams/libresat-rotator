  - {group: Lift arms and counterweights, ref: lift_arm, item: "Lift arm: 6063 flat bar 40 x 8 with foot plate, sawn and drilled (mass from the build report)", qty: 2, eur: 4.0, alt: "offcut of the boom tube stock"}
  - {group: Lift arms and counterweights, ref: counterweight, item: "Counterweight: Ø30 steel slug on a Ø10 rod, sliding with a set screw (1.02 kg each, PARAMETRIC; mass from the build report)", qty: 2, eur: 3.5, alt: "lead-free ballast; trim to the measured antenna moment (LSR2_ASSEMBLY, balancing)"}
  - {group: Hardware, item: "Keys DIN 6885 (2x 5x5, 1x 8x7)", qty: 3, eur: 0.5, mass_g: 3}
