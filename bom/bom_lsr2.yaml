  - {group: Hardware, item: "M8 U-bolts for the mast (A4-80 or 8.8)", qty: 2, eur: 2.5, mass_g: 90, alt: "8.8 zinc-flake instead of A4-80"}
  - {group: Hardware, item: "V-ring seals (AZ + EL) + Ø6 cross pin", qty: 1, eur: 3.0, mass_g: 15}
  - {group: Hardware, item: "DIN 471 Ø30 circlip + 1 x M30x56x3 stainless washer under the 51206 (Mk5 shim, SARCNET; a 2nd washer adjusts the preload)", qty: 2, eur: 0.7, mass_g: 14, alt: "cheaper than a DIN 705 Ø30 set collar (~4 EUR); ring replaced by the standard washer"}
  - {group: Hardware, item: "EL bearing circlips: 2x DIN 471 Ø30 + 2x DIN 472 Ø62", qty: 1, eur: 1.2, mass_g: 6}
  - {group: Hardware, item: "DIN 705 Ø14 flanged set collar + M6 screw (AZ shaft top)", qty: 1, eur: 2.5, mass_g: 25, alt: "cheaper than a turned disc (~5 EUR with machining)"}
  - {group: Fasteners, item: "A4 M6x20 socket screw (housing to base 6, bracket to base 4, EL gearbox to bracket 4)", qty: 14, eur: 0.15, mass_g: 12, alt: "8.8 zinc-flake screws; use Tef-Gel either way"}
  - {group: Fasteners, item: "A4 M6x25 socket screw (AZ gearbox through spacer)", qty: 4, eur: 0.18, mass_g: 14}
  - {group: Fasteners, item: "A4 M6x16 socket screw (bearing housing to EL gearbox face B, ball-end hex key through the side windows)", qty: 4, eur: 0.14, mass_g: 10}
  - {group: Fasteners, item: "A4 M6x30 pinch screw (boom_socket hub, slit)", qty: 1, eur: 0.2, mass_g: 17}
  - {group: Fasteners, item: "A4 M8x65 through-bolt + nut + washers (tube in the boom_socket, drilled at assembly)", qty: 2, eur: 0.6, mass_g: 50}
  - {group: Fasteners, item: "A4 M5x12 screw (NEMA23 to NMRV030 B14 flange; check the real flange)", qty: 8, eur: 0.1, mass_g: 4}
  - {group: Corrosion, item: "Tef-Gel 25 g tube (Al-steel joints, bearing seats, all stainless threads; Duralac is the alternative)", qty: 1, eur: 6.0, mass_g: 40}
  - {group: Electronics, item: "LSR-CTL PCB 100 x 80 mm (JLCPCB/PCBWay, 5 pcs ~ 10 EUR)", qty: 1, eur: 2.0, mass_g: 25}
  - {group: Electronics, item: "LSR-CTL components (hardware/fab/lsr_ctl_bom.md)", qty: 1, eur: 8.0, mass_g: 20}
  - {group: Electronics, item: "Raspberry Pi Pico (or Pico W / Pico 2) with headers", qty: 1, eur: 5.0, mass_g: 4, alt: "Mk5 alternative: Elecrow Pico W5 board with Wi-Fi AP + Telnet (SARCNET), see docs/ELECTRONICS.md"}
  - {group: Electronics, item: "Raspberry Pi Zero 2 WH", qty: 1, eur: 20.0, mass_g: 11, alt: "optional: not needed when the PC tracker talks EasyComm II 9600 8N1 over USB/UART"}
  - {group: Electronics, item: "microSD 16 GB (A1)", qty: 1, eur: 4.0, mass_g: 1}
  - {group: Electronics, item: "DM542 stepper driver (external, step/dir, 48 V, 400 microsteps/rev as Mk5)", qty: 2, eur: 12.0, mass_g: 150, alt: "clones from ~9 EUR; TB6600 is cheaper but rougher"}
  - {group: Electronics, item: "Level converter 3.3 V to 5 V, 4 channels (STEP/DIR/ENA for the DM542 opto inputs, shared by both drivers)", qty: 1, eur: 1.5, mass_g: 3, alt: "74HCT245/74AHCT125 on the LSR-CTL board is cheaper (VERIFY)"}
  - {group: Electronics, item: "Power supply 48 V 6 A (24-48 V accepted; 288 W covers 2 x DM542 at 3 A with margin)", qty: 1, eur: 25.0, mass_g: 600, alt: "Mk5 uses the Mean Well S-400-48 (48 V 8.3 A, ~45 EUR, ~1.1 kg, SARCNET): adopt it only if you want the spare power; dearer and heavier without benefit here"}
  - {group: Electronics, item: "XL7015 buck module, 48 V to 5 V (Pico / logic supply, Mk5)", qty: 1, eur: 2.0, mass_g: 10}
  - {group: Electronics, item: "48 V power-loss detect: opto-isolated (PC817 + 47 k 2 W-class series resistor, 1N4007) on LSR-CTL, plus 2200 uF 63 V bulk capacitor", qty: 1, eur: 3.0, mass_g: 40, alt: "values VERIFY on the bench: hold-up time must cover the ~60 ms flash save"}
  - {group: Sensors, item: "AS5600 magnetic encoder board + magnet (one per output shaft)", qty: 2, eur: 2.0, mass_g: 2}
  - {group: Sensors, item: "Slotted photo-interrupter, EE-SX1103 class, 5 mm gap (index, one per axis; Mk5 idea, SARCNET). VERIFY part and output type (NPN open collector, 5-24 V)", qty: 2, eur: 2.0, mass_g: 5, alt: "cheaper generic LM393 slot-sensor boards (~1 EUR, 3.3 V logic) work too"}
