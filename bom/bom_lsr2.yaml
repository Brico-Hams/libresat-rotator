  - {item: "6003-2RS bearing 17x35x10 (worm)", qty: 2, eur: 1.5}
  - {item: "Lip seal TC 25x42x7 (output) / TC 17x30x7 (input)", qty: 3, eur: 0.55}
  - {item: "M5 socket screw (joint) + Ø5 dowel pin", qty: 6, eur: 0.12}
  - {item: "Circlips and shim set, grease NLGI 00, sealant, 4x4 key", qty: 1, eur: 1.4}
  - {item: "A356 casting, lower + upper half (poured metal, see materials report)", qty: 2, eur: 4.3}
