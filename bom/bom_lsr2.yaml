# LibreSat Rotator LSR-2 (heavy), phase 11 - bill of materials for ONE rotator, rendered by scripts/bom.py -> docs/BOM_LSR2.md
# Every price and every bought-part mass is VERIFY (generic catalogue values). EUR, 2026.
# fabricated: NO masses and NO prices here. scripts/bom.py reads the finished masses from build/lsr2_build_report.json and the costs of BOTH
#   manufacturing routes from calc/lsr2_materials.py (route A cast, route B CNC), lists both variants and uses the cheaper one as the default
#   (within 5 % the lighter). It checks the fabricated mass within 1 % against an independent sum (reported volume x density).
#   `report` = key of the part in the build report (`parts.<name>` or `shafts.<name>`).
# alt: a cheaper alternative where one exists.
fabricated:
  - {part: body,         report: body,         material_a: "A356-T6", material_b: "6082-T6", source_a: "cast/lsr2/body_{finished,preform,pattern}.step|stl|3mf, body_core.step", source_b: "cnc/lsr2/body_finished.step, body_blank.step, cam/lsr2/body_setups.csv", alt: "route A (cast) unless the quote says otherwise: the body is 5 bolted slabs on route B"}
  - {part: lid,          report: lid,          material_a: "A356-T6", material_b: "6061-T6", source_a: "cast/lsr2/lid_{finished,preform,pattern}.step|stl|3mf", source_b: "cnc/lsr2/lid_finished.step, lid_blank.step, cam/lsr2/lid_setups.csv"}
  - {part: mast_bracket, report: mast_bracket, material_a: "A356-T6", material_b: "6082-T6", source_a: "cast/lsr2/mast_bracket_{finished,preform,pattern}.step|stl|3mf", source_b: "cnc/lsr2/mast_bracket_finished.step, mast_bracket_blank.step, cam/lsr2/mast_bracket_setups.csv"}
  - {part: yoke_arm,     report: yoke_arm,     material_a: "A356-T6", material_b: "6082-T6", source_a: "cast/lsr2/yoke_arm_{finished,preform,pattern}.step|stl|3mf", source_b: "cnc/lsr2/yoke_arm_finished.step, yoke_arm_blank.step, cam/lsr2/yoke_arm_setups.csv"}
  - {part: saddle,       report: saddle,       material_a: "A356-T6", material_b: "6061-T6", source_a: "cast/lsr2/saddle_{finished,preform,pattern}.step|stl|3mf", source_b: "cnc/lsr2/saddle_finished.step, saddle_blank.step, cam/lsr2/saddle_setups.csv"}
  - {part: boom_clamp,   report: boom_clamp,   material_a: "A356-T6", material_b: "6061-T6", source_a: "cast/lsr2/boom_clamp_{finished,preform,pattern}.step|stl|3mf", source_b: "cnc/lsr2/boom_clamp_finished.step, boom_clamp_blank.step, cam/lsr2/boom_clamp_setups.csv"}
  - {part: az_shaft,     report: shafts.az_shaft, material: "stainless 1.4404 round bar (size in LSR2_MATERIALS)", source: "cnc/lsr2/az_shaft.step, stl/lsr2/az_shaft.stl", alt: "1.4301 (A2) bar is cheaper; keep 1.4404 for the coast"}
  - {part: el_shaft,     report: shafts.el_shaft, material: "stainless 1.4404 round bar (size in LSR2_MATERIALS)", source: "cnc/lsr2/el_shaft.step, stl/lsr2/el_shaft.stl"}
  - {part: el_sleeve,    report: shafts.el_sleeve, material: "stainless 1.4404 round bar (size in LSR2_MATERIALS)", source: "cnc/lsr2/el_sleeve.step, stl/lsr2/el_sleeve.stl"}
items:
  - {group: Motion, ref: gearbox, item: "NMRV030 worm gearbox 80:1, Ø14 hollow output (AZ and EL)", qty: 2, eur: 55.0, mass_g: 1100, alt: "second-hand or Mk5-style imports; check ratio and bore (SARCTrac Mk5 uses the same NMRV030 80:1, SARCNET)"}
  - {group: Motion, ref: motor, item: "NEMA23 stepper 57BYG250H-8, 2.8 N·m, 3 A, 112 mm (the Mk5 motor, SARCNET; VERIFY wiring/model)", qty: 2, eur: 18.0, mass_g: 900}
  - {group: Bearings, ref: brg6206, item: "6206-2RS bearing (AZ radial pair)", qty: 2, eur: 3.5, mass_g: 200}
  - {group: Bearings, ref: brg51206, item: "51206 thrust bearing (AZ axial; smaller-bore ring on top as Mk5)", qty: 1, eur: 6.0, mass_g: 170}
  - {group: Bearings, ref: brg6004, item: "6004-2RS bearing (EL pair, one in each side wall boss of the body)", qty: 2, eur: 2.5, mass_g: 90}
