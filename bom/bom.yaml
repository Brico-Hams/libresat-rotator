  - {group: Electronics, item: "microSD 16 GB (A1)", qty: 1, eur: 4.0, mass_g: 1}
  - {group: Sensors, item: "AS5600 magnetic encoder board", qty: 2, eur: 2.0, mass_g: 2}
  - {group: Sensors, item: "MPU-6050 GY-521 (boom elevation + base level)", qty: 2, eur: 1.5, mass_g: 3}
  - {group: Sensors, item: "DRV5032FB / AH1806 3.3 V hall switch + 6x3 mm magnet (AZ index)", qty: 1, eur: 1.0, mass_g: 2}
  - {group: Sensors, item: "GPS ATGM336H (or NEO-M8N) with 25 mm patch", qty: 1, eur: 6.0, mass_g: 10}
  - {group: Hardware, item: "Heat-set inserts M3 (x20) and M4 (x16)", qty: 1, eur: 3.0, mass_g: 20}
