optional:
  - {item: "LiFePO4 12.8 V 6 Ah battery with BMS (+ XT30)", eur: 35}
  - {item: "USB-C PD power bank >= 20 000 mAh with 12 V PD output", eur: 30}
  - {item: "Survey tripod 5/8-11 (aluminium) or photo tripod >= 3 kg rating", eur: 30}
  - {item: "17HS08-1004S pancake motors (Lite version, light antennas only)", eur: 16}
